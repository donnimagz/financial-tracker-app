<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Centered Card/Wallet Glow -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Base plate -->
    <rect width="300" height="300" rx="60" fill="url(#accentGrad)"/>
    
    <!-- Accent badge -->
    <circle cx="150" cy="150" r="90" fill="#09090b" fill-opacity="0.4"/>
    
    <!-- Trend & Cash graphic -->
    <!-- Upward arrow trend -->
    <path d="M 85 195 L 135 145 L 175 175 L 225 110" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 185 110 L 225 110 L 225 150" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Coin/Currency token badge -->
    <circle cx="150" cy="150" r="32" fill="url(#glowGrad)"/>
    <text x="150" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">U</text>
  </g>
</svg>
